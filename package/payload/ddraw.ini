; DK2VR 0.6.9 - dxwrapper fork, no RTX Remix required
[General]
WrapperMode=ddraw.dll
RealDllPath=AUTO
DisableLogging=0

[Compatibility]
Dd7to9=1
D3d9to9Ex=1
EnableD3d9Wrapper=1
DDrawCompat=0
DisableGameUX=1

[Dd7to9]
DdrawUseDirect3D9Caps=1
DdrawAutoFrameSkip=0
DdrawConvertHomogeneousW=0
DdrawUseNativeResolution=0
DdrawMaintainAspectRatio=1
; DK2VR 0.2.8: DKII locks a render surface every frame (lockBuf 0x590AC0, ~60 % of the waits measured in
; the driver). A shadow surface serves these locks from system memory. Controlled by ShadowSurface in DK2VR.ini.
DdrawUseShadowSurface=1

[d3d9]
EnableWindowMode=0
WindowModeBorder=1
FullscreenWindowMode=0
EnableVSync=0
; DK2VR 0.2.4: the game asks for a wait on the monitor refresh at every flip. At 60 Hz any frame
; above 16.7 ms then drops to 30 fps. The headset has its own timing: never wait for the monitor.
ForceVsyncMode=1
AntiAliasing=0
AnisotropicFiltering=0
