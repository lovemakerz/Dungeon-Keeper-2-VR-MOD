[VR]
; ===== DK2VR 0.6.9 =====
; 0 = automatique, 1 = plateau, 2 = possession, 3 = ecran flottant
Mode=0
; Corrige la position de la souris Windows/Virtual Desktop dans le jeu.
MouseCoordinates=1
ResolutionScale=1.0
MaxEyeDimension=4096

; ----- Table facon Demeo (nouveau en 0.2.0) -----
; 1 = le donjon est pose sur une table fixe devant vous (poignees pour la deplacer).
; 0 = ancien affichage 0.1.0 (vue attachee a la camera du jeu).
TableAnchor=1
; Largeur de la zone visible du donjon sur la table, en metres.
TableWidth=0.80
; Vue de la table (0.4.7). 1 = la table montre au moins tout ce que montre l'ecran PC (le donjon
; parait plus petit, le moteur calcule une zone plus grande). 0 = ancienne vue (zone centrale agrandie).
TableView=1
; 0.5.13 : camera du jeu presque verticale pendant la vue table (zone calculee = rectangle de la table :
; plus rapide, plus de bande vide cote joueur). L'ecran PC montre alors une vue de dessus. 0 = inclinaison du joueur.
TopDownCamera=1
; Coupe ce qui depasse le haut des murs au-dessus de la table (morceaux d'interface flottants). 0 = garder.
HideFloatingUi=1
; Profondeur maximale de la table = TableAspect x largeur (0.75 = plus large que profonde). 0 = forme du jeu.
TableAspect=0.75
; Distance du centre de la table devant les yeux (metres).
TableDistance=0.80
; Hauteur du plateau sous les yeux au recentrage (0.4.7 : 0.50).
TableHeight=0.50
; Option : hauteur du plateau au-dessus du sol reel (au moins 0.30 m sous les yeux). 0 = desactive.
TableTopHeight=0
; Zoom arriere supplementaire dans le jeu pour voir plus du donjon.
; 0 = limite d'origine du jeu, 1.0 = +100 % de recul (0.3.2, compense la table moins profonde ; maximum 4).
ZoomOutExtra=1.0
; Molette de la souris = zoom du jeu (1), ou comportement d'origine (0). Pas : 5 a 500.
WheelZoom=1
WheelZoomStep=50
; Controleurs VR : 1 = actifs, 0 = ignores.
Controllers=1
ShowControllers=1
; 2 = table fixe (0.3.1) : une poignee fait glisser le donjon, deux poignees zooment et font tourner
;     le donjon (vraie rotation de la camera du jeu). Poignees en fer sous le bord (deux par cote) :
;     une main = tourner la table sur elle-meme, deux mains = la deplacer. Clic du stick = la replacer.
; 1 = gestes 0.2.1 a 0.3.0 (deux poignees tournent/deplacent toute la table).
; 0 = gestes de la 0.2.0 (une poignee deplace la table, deux poignees changent sa taille).
GrabMode=2

; ----- Salle et table (nouveau en 0.4.0) -----
; 1 = petite salle de donjon voutee (pierre en relief, dalles, torches, porte cintree) et table en bois
;     moulure, pieds tournes, huit poignees en fer pendantes. 0 = fond noir et socle simple de la 0.3.2.
Environment=1
; Lissage des bords dans le casque : 4 (recommande), 8, 2 ou 0.
Antialiasing=4

; ----- Fluidite (nouveau en 0.3.0) -----
; 1 = rendu VR decouple : un fil dedie redessine la derniere image du jeu a chaque image du casque
;     avec la position actuelle de la tete, de la table et des mains (tete, table et glisser fluides
;     meme quand le jeu tourne a 40 images/s). 0 = rendu de la 0.2.9 (une image VR par image du jeu).
DecoupledRendering=1
; 1 = pendant le glisser a une main, le donjon suit la main entre deux images du jeu. 0 = desactive.
PanPrediction=1
; Avance maximale (metres) de la carte sur le jeu quand on la fait glisser (0.5.10 : 0.05 ; avant 0.25).
PanPredictionLimit=0.05
; Rafraichissement de securite des copies de textures (en images du jeu). 0 = jamais.
TextureRefreshFrames=180
; Attente maximale (ms) de l'image du casque correspondant a la derniere position de la tete. 0 = aucune.
FreshFrameWaitMs=0

; ----- Qualite des textures du jeu (0.4.5) -----
; Taille du cache de textures du jeu, en blocs de 256x256. Le jeu en prevoit 24 : trop peu pour la vue
; de la table, il charge alors des versions floues de certaines textures. 96 = comme le mode grande
; resolution du projet Flame. 24 = comportement d'origine. Maximum 120.
; 0.5.10 : nombre de textures 128x128 gardees par le jeu (d'origine 512). Avec la vue large de la table,
; 512 ne suffisait pas : ~1300 rechargements par seconde (lenteur). 1536 = 96 Mo. Maximum 4096.
TextureCacheBlocks=1536
; Force la qualite maximale des textures du jeu (0.4.6) : pas de versions reduites (floues),
; quel que soit le reglage video du jeu. 0 = garder le reglage du jeu.
ForceTextureQuality=1
; Nettete en VR (0.4.7) : filtrage anisotrope des textures du jeu (1 = desactive, 16 = maximum)
; et biais de detail (0 = neutre, negatif = plus net mais scintille).
VrAnisotropy=16
VrLodBias=0

; ----- Visibilite du moteur (trous) -----
; Le jeu ne dessine que ce qui est dans son cadre ecran. Ces valeurs elargissent ce cadre
; et la distance d'affichage pendant le choix des cases dessinees. 1.0 = comportement d'origine.
; 0.2.5 : 1.15 = petite marge pour que les coins de la table ne soient pas coupes en biais.
ViewExpand=1.15
ViewFarScale=1.0
; 1 = affiche aussi les faces que le jeu retire quand elles sont dos a sa camera (corrige les trous).
; 0 = comportement d'origine du jeu.
DrawBackFaces=1
; Mesure automatique de l'utilisation du processeur par le jeu (journal). 0 = desactive.
Profiler=1
; 1 = le jeu n'attend plus le rafraichissement de l'ecran PC (le casque a sa propre cadence).
NoMonitorVSync=1
; 1 = synchronisation GPU differee d'une image : le jeu n'attend plus la carte graphique.
PipelinedSync=1
; 1 = l'image de l'ecran PC ne bloque jamais le jeu (images ecran sautees si besoin).
NonBlockingPresent=1
; 1 = socle et rectangle ajustes sur la geometrie (lisse sur ~1 s, borne). 0 = sol calcule depuis la camera seulement.
MeasuredLevels=1
; 1 = surface miroir pour les verrous 2D du jeu (evite l'attente de la carte graphique). 0 = comportement 0.2.7.
; Pris en compte au prochain lancement.
ShadowSurface=1
; 0.5.3 : le jeu ecrit ses textures dans une copie en memoire systeme, envoyee ensuite a la carte graphique
; sans attente (avant : le jeu attendait la carte graphique a chaque ecriture, ~60 % de son temps). 0 = ancien comportement.
GameTextureShadow=1

; ----- Panneau de l'ecran du jeu (interface) -----
; 1 = grand ecran en face, comme sur un mur derriere la table. 0 = petit panneau lateral de la 0.1.0.
PanelPosition=1
PanelDistance=2.2
PanelHeight=0.35
PanelWidth=1.8

; ----- Ancien mode (TableAnchor=0) et possession -----
; Plus cette valeur est grande, plus le donjon est petit.
TableUnitsPerMeter=10.0
PossessionUnitsPerMeter=1.0
; Le centre de la camera du jeu est place sous le regard horizontal.
TablePitchDegrees=50.0

; ----- Contour et performances -----
; Limites rectangulaires et socle, uniquement en mode plateau. 0 = sans contour.
TableBoundary=1
; Fraction conservee du rectangle inscrit : 0.50 a 1.00, sans changer l'echelle.
TableCrop=0.92
; 1 = rendu stereo regroupe (0.2.1, plus rapide). 0 = rendu dessin par dessin de la 0.2.0.
BatchedRendering=1
; Utilise seulement si BatchedRendering=0 : 1 = sauvegarde rapide des etats (0.2.0), 0 = methode 0.1.0.
FastStates=1
; ===== 0.6.1 : interface VR (HUD en modules transparents + pointeur laser + main du gardien) =====
; 1 = HUD en modules (touche F4 pour afficher/masquer)
Hud=1
; 1 = gaucher : laser et main du gardien a gauche, minicarte a droite
LeftHanded=0
; Minicarte : 0 = piedestal a cote de la table, 1 = montre sur l'avant-bras, 2 = montre visible seulement quand on la regarde (F2 change en jeu)
MinimapMode=0
; Panneau creatures/sorts/salles : 0 = derriere le donjon, bord oppose de la table, 1 = petit et presque a plat au bord cote joueur
HudBottomPlace=0
; Largeurs en metres (barres du mur, panneau creatures/sorts, minicarte) et hauteur de la main du gardien
HudWallWidth=1.8
HudBottomWidth=0.80
HudMinimapWidth=0.30
CursorSize=0.10
; 1 = le curseur du jeu est retire des panneaux (il est sur la manette)
HudHideCursor=1
; 0.6.2 : vitesse de defilement de la carte au stick de la main gauche (metres de table par seconde)
StickScrollSpeed=0.6
; 0.6.4 : 1 = la main du gardien (curseur du jeu, avec ses animations et les creatures tenues) au bout de la manette (CursorSize = taille pour 64 pixels)
KeeperHand=1
; 0.6.5 : ce que tient la main (creatures, or, icones) est retire des panneaux et affiche sous la main ; rayon de recherche autour du curseur (pixels du jeu)
HeldThingsOnHand=1
HeldRadius=200

; 0.6.5.3 : objet tenu = zone de l interface autour du curseur (1) / ancienne detection (0)
HeldWindow=1
; 0.6.5.3 : cartes animees retirees du donjon (0 = desactive depuis 0.6.6.1 : attrapait des murs)
InterfaceCardsOutOfDungeon=0
; 0.6.6 : laser sur la table = curseur du jeu (gachette = clic gauche, A/X = clic droit)
TablePointer=1
; 0.6.9 : toute la table pointable (champ de vision du jeu elargi pendant la vue table)
; 0.6.9.2 : corrige (la 0.6.9 trouait les bords : le decoupage des cases gardait l'ancien champ de vision)
TablePickAll=1
; 0.6.9.3 : TablePickScale = limite basse. Le mod choisit le plus grand facteur qui garde toute la table
; entre la barre du haut (TablePickTop) et la barre des statistiques (TablePickBottom) : textures plus nettes.
TablePickScale=0.30
TablePickTop=0.07
TablePickBottom=0.68
; 0.6.9.3 : pieces d'interface animees en 3D au-dessus des barres du bas renvoyees vers le HUD (plus sur la table)
Ui3DFilter=1
; 0.6.9.3 : runtime OpenXR. system (defaut) = le runtime OpenXR actif du systeme, sans detection.
; auto = essaie d'abord Virtual Desktop (VDXR) puis celui du systeme (comportement 0.6.9.2).
OpenXRRuntime=system
; 0.6.9.15 : barres et minicarte VR decoupees dans l'image finale du jeu (ce que montre l'ecran du PC).
; 0 = ancienne methode (interface reconstituee dessin par dessin).
HudFromGameImage=1
